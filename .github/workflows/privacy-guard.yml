name: privacy-guard

on:
  push: {}
  pull_request: {}

permissions: { contents: read }

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan repo for personal data (prints file names only)
        run: python scripts/privacy_guard.py
