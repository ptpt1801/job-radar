name: daily

on:
  schedule: [{ cron: "0 19 * * *" }]   # 02:00 Asia/Ho_Chi_Minh
  workflow_dispatch: {}

permissions: { contents: write, issues: write }
concurrency: { group: pipeline, cancel-in-progress: false }

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # No custom adapter needs a browser yet; add `playwright install --with-deps chromium` here if one does.

      - name: Pipeline
        env:
          CV_PROFILE_JSON: ${{ secrets.CV_PROFILE_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pipeline --only-new

      - name: Tests
        run: pytest -q pipeline/tests

      - name: Privacy guard
        run: python scripts/privacy_guard.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site/i18n/taxonomy.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          NEW=$(python -c "import json;print(json.load(open('data/meta.json'))['last_run']['new'])")
          CLOSED=$(python -c "import json;print(json.load(open('data/meta.json'))['last_run']['closed'])")
          git commit -m "data: daily update $(TZ=Asia/Ho_Chi_Minh date +%F) (+${NEW} new, -${CLOSED} closed)"
          git push
