name: rescore

on:
  workflow_dispatch: {}

permissions: { contents: write }
concurrency: { group: pipeline, cancel-in-progress: false }

jobs:
  rescore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Rescore all open jobs (no fetching)
        env:
          CV_PROFILE_JSON: ${{ secrets.CV_PROFILE_JSON }}
        run: python -m pipeline --rescore-all
      - run: python scripts/privacy_guard.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: rescore $(TZ=Asia/Ho_Chi_Minh date +%F)"
          git push
