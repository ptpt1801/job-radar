name: pages

on:
  push:
    branches: [main]
  workflow_run:
    workflows: [daily, rescore, workday]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: { group: pages, cancel-in-progress: true }

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Assemble site (site/ + data/ -> _site/)
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data
          cp data/*.json _site/data/
          if [ -d data/details ]; then cp -r data/details _site/data/; fi
          rm -f _site/data/state.json _site/data/health_history.json
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
